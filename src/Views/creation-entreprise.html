<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeSoMate - Créer votre entreprise</title>
    <link rel="stylesheet" href="./style/style.css">
</head>

<body>
    <header>
        <div class="logo-container">
            <a href="index.html"><img src="./img/image.png" alt="logo" class="logo"></a>
        </div>

        <div class="container">
            <div class="titre-container">
                <h1>SeSoMate</h1>
                <h2>Trouvez les meilleures offres du moment</h2>
            </div>

            <div class="actions-container">
                <input type="search" placeholder="Rechercher un poste, une entreprise...">

                <select name="filtres" id="fil">
                    <option value="">Filtres</option>
                    <option value="Entreprise">Entreprise</option>
                    <option value="Offre">Offre</option>
                    <option value="Wishlist">Wishlist</option>
                </select>

                <select name="tri" id="tri">
                    <option value="">Trier par</option>
                    <option value="Intitulé">Intitulé</option>
                    <option value="Salaire">Salaire</option>
                    <option value="Date">Date</option>
                </select>
            </div>
        </div>
        
        <div class="login-container">
            <button>Sign up</button>
        </div>
    </header>

    <main class="main-centered">
        <section class="form-section">
            <h2 class="page-title">Créer votre entreprise</h2>
            
            <div class="form-card">
                <form method="post">
                    
                    <div class="input-group">
                        <label for="company_name">Nom de l'entreprise :</label>
                        <input type="text" id="company_name" name="company_name" required>
                    </div>

                    <div class="input-group">
                        <label for="numero_tel">Numéro de téléphone :</label>
                        <input type="tel" id="numero_tel" name="numero_tel" required>
                    </div>

                    <div class="input-group">
                        <label for="location">Lieu :</label>
                        <input type="text" id="location" name="location" required>
                    </div>

                    <div class="input-group">
                        <label for="email">Email de contact :</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="input-group row-group">
                        <div class="half-width">
                            <label for="secteur">Secteur d'activité :</label>
                            <select id="secteur" name="secteur" required>
                                <option value="">Sélectionnez un secteur</option>
                                <option value="informatique">Informatique</option>
                                <option value="sante">Santé</option>
                                <option value="finance">Finance</option>
                                <option value="education">Éducation</option>
                                <option value="autre">Autre</option>
                            </select>
                        </div>

                        <div class="half-width">
                            <label for="taille">Taille d'entreprise :</label>
                            <select id="taille" name="taille" required>
                                <option value="">Sélectionnez une taille</option>
                                <option value="startup">Startup</option>
                                <option value="pm">PME</option>
                                <option value="grande">Grande entreprise</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="type">Type d'entreprise :</label>
                        <select id="type" name="type" required>
                            <option value="">Sélectionnez un type</option>
                            <option value="privée">Privée</option>
                            <option value="public">Publique</option>
                        </select>
                    </div>

                    <input type="submit" value="Créer l'entreprise" class="btn-submit">
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 SeSoMate. Tous droits réservés.</p>
            <div class="footer-links">
                <a href="#">Mentions légales</a>
                <a href="#">Contact</a>
                <a href="#">À propos</a>
            </div>
        </div>
    </footer>
</body>

</html>
