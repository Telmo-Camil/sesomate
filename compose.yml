services:
 
  web:
    build: ./docker/apache
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/Project_CESI_Web
    depends_on:
      - db
 
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_DATABASE: projet_web
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3366:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql